[package]
name = "nexpass"
version = "7.0.1"
description = "NexPass — secure credential vault for Android"
authors = ["Arabi Islam, MR. ARX <NexApp>"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
# Handles the Android <-> browser round trip for Google sign-in: the
# OS hands the OAuth redirect back to us as a deep-linked URL instead
# of a loopback HTTP request (see google_auth.rs for why the old
# desktop-style loopback server doesn't work with an Android-type
# OAuth client). This plugin owns the AndroidManifest intent-filter
# wiring so we don't have to hand-patch it.
tauri-plugin-deep-link = "2"
tauri-plugin-nexpass-installer = { path = "../tauri-plugin-nexpass-installer" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Crypto layer — used by crypto.rs (key derivation + encrypt/decrypt)
# and google_auth.rs (PKCE code_verifier/code_challenge for the Android
# sign-in flow, which has no client secret to fall back on).
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
base64 = "0.22"
sha2 = "0.10"

# Google Sign-In (system browser + deep-link redirect) + Firebase Auth REST calls.
# rustls-tls (not the default native-tls) because native-tls needs OpenSSL
# cross-compiled for the Android NDK target, which is a common source of
# Android build failures; rustls is pure Rust and cross-compiles cleanly.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
urlencoding = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }

# Biometric unlock (fingerprint / face) — the only per-platform extra this
# app still needs, now that it's Android-only.
tauri-plugin-biometric = "2"

[lib]
name = "nexpass_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "nexpass"
path = "src/main.rs"

# Release build tuning — smaller binary, faster startup.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
