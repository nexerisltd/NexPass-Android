name: Android signed APK build

# NOTE (v7.0.1): this workflow previously skipped `tauri android init`
# and the two .github/scripts patch steps entirely, and wrote secrets
# to a `.env` file that nothing in the Rust code actually reads (the
# app expects a real src-tauri/src/secrets.rs module — see
# secrets.rs.example). Both bugs are fixed below; this workflow now
# mirrors build-android.yml's (already-correct) sequence.

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Setup Java
        id: setup-java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install Android SDK components
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;25.2.9519653"

      - name: Install npm dependencies
        run: npm install

      - name: Write secrets.rs
        run: |
          mkdir -p src-tauri/src
          cat > src-tauri/src/secrets.rs << SECRETS
          pub const GOOGLE_CLIENT_ID: &str = "${{ secrets.GOOGLE_CLIENT_ID }}";
          pub const GOOGLE_CLIENT_SECRET: &str = "${{ secrets.GOOGLE_CLIENT_SECRET }}";
          pub const FIREBASE_API_KEY: &str = "${{ secrets.FIREBASE_API_KEY }}";
          SECRETS

      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > src-tauri/nexpass-release.jks

      - name: Init Android project
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: npx tauri android init

      - name: Patch build.gradle.kts for release signing
        run: python3 .github/scripts/patch_gradle.py

      - name: Patch Android project for in-app APK install
        run: python3 .github/scripts/patch_android_installer.py

      - name: Write keystore.properties
        run: |
          cat > src-tauri/gen/android/keystore.properties << PROPS
          storeFile=../../../nexpass-release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          PROPS

      - name: Build signed APK
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          JAVA_HOME: ${{ steps.setup-java.outputs.java-home }}
        run: npx tauri android build --apk

      - uses: actions/upload-artifact@v4
        with:
          name: nexpass-signed-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
